<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOKKA Admin — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body { 
      background-color: #0b0a08; 
      color: #efe7d8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    
    /* Hide standard header/footer for this specific page layout */
    header, footer { display: none !important; }

    .split-layout {
      display: flex;
      width: 100%;
      max-width: 1100px;
      gap: 60px;
      align-items: center;
    }
    
    .hero-side {
      flex: 1;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px;
      background: linear-gradient(180deg, rgba(11,10,8,0.9) 0%, rgba(11,10,8,0) 50%, rgba(11,10,8,0.8) 100%), url('C:/Users/HP/.gemini/antigravity-ide/brain/605350d9-c854-4416-ad9b-d1a7e9ed8330/login_hero_chair_1788293260285.jpg') center/cover no-repeat;
    }
    
    .hero-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #0b0a08 0%, transparent 40%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }
    
    .logo-hero {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Fraunces', serif;
      font-size: 20px;
      letter-spacing: 0.05em;
      margin-bottom: 60px;
      color: #c99a52 !important;
    }
    
    .logo-hero svg {
      width: 24px; height: 24px;
    }
    
    .hero-content h1 {
      font-family: 'Fraunces', serif;
      font-size: 52px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 12ch;
    }
    
    .hero-content h1 i {
      font-style: italic;
    }
    
    .hero-content p {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(239, 231, 216, 0.7);
      max-width: 38ch;
    }

    .form-side {
      flex: 1;
      max-width: 440px;
      background: #11100e;
      border: 1px solid rgba(239, 231, 216, 0.08);
      border-radius: 16px;
      padding: 48px;
    }
    
    .form-side h2 {
      font-family: 'Fraunces', serif;
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    
    .form-side .sub {
      font-size: 14px;
      color: rgba(239, 231, 216, 0.6);
      margin-bottom: 40px;
    }

    .form-group { margin-bottom: 24px; }
    
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #efe7d8;
    }
    
    .input-wrap {
      position: relative;
    }
    
    .input-wrap svg {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      color: rgba(239, 231, 216, 0.4);
      width: 18px; height: 18px;
    }
    
    .form-control {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(239, 231, 216, 0.15);
      border-radius: 8px;
      padding: 14px 16px 14px 44px;
      color: #efe7d8;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .form-control:focus {
      border-color: #c99a52;
    }
    
    .form-control::placeholder {
      color: rgba(239, 231, 216, 0.3);
    }
    
    .btn-submit {
      width: 100%;
      background: #c99a52;
      color: #11100e;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      margin-top: 12px;
      margin-bottom: 20px;
    }
    
    .bottom-link {
      text-align: center;
      font-size: 13px;
      color: rgba(239, 231, 216, 0.6);
      margin-top: 32px;
    }
    .bottom-link a {
      color: #c99a52;
      text-decoration: none;
      cursor: pointer;
    }

    #errorMsg { color: #f45b5b; font-size: 13px; margin-top: 16px; text-align: center; display: none; }

    @media (max-width: 900px) {
      .split-layout { flex-direction: column; }
      .hero-side { display: none; }
    }
  </style>
</head>
<body>

<div class="split-layout">
  
  <div class="hero-side">
    <div class="hero-content">
      <a href="index.html" class="logo-hero" style="color:inherit; text-decoration:none;">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V9M4 9L12 4L20 9M4 9H20M20 20V9M9 20V13H15V20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        NOKKA
      </a>
      <h1>Manage the <i>Studio</i> from anywhere.</h1>
      <p>Securely access the NOKKA administration portal to manage user accounts, update product inventory, and monitor order fulfillment.</p>
    </div>
  </div>

  <div class="form-side">
    <h2>Admin Portal</h2>
    <p class="sub">Log in to access your administrative dashboard.</p>
    
    <form id="loginForm" onsubmit="handleLogin(event);">
      <div class="form-group">
        <label>Admin Email</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" id="loginEmail" class="form-control" placeholder="admin@nokkastudio.com" value="admin@nokkastudio.com" required>
        </div>
      </div>
      
      <div class="form-group">
        <label>Passcode</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter master passcode" required>
        </div>
      </div>
      
      <button type="submit" class="btn-submit">ADMIN LOGIN</button>
    </form>
    
    <p class="bottom-link"><a href="index.html">← Back to Website</a></p>
    <div id="errorMsg"></div>
  </div>

</div>

<script>
  window.handleLogin = async function(e) {
    e.preventDefault();
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';
    try {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('loginPassword').value }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Invalid administrative credentials.');
      localStorage.setItem('nokka_admin_token', data.token);
      window.location.href = 'admin.html';
    } catch (err) {
      errEl.textContent = err.message || 'Network error contacting server.';
      errEl.style.display = 'block';
    }
  };
  if (localStorage.getItem('nokka_admin_token')) window.location.replace('admin.html');
</script>

</body>
</html>
